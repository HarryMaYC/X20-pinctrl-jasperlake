name: Build DKMS DEB Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential dh-make dkms devscripts

      - name: Build deb package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Move deb files
        run: |
          mv ../*.deb .

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinctrl-jasperlake-deb
          path: ./*.deb
